# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# ✅ Dialecto correcto para H2 (opcional, Spring Boot 3.x lo configura automáticamente)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always  # Ejecuta el script SQL siempre al iniciar
spring.sql.init.schema-locations=classpath:schema.sql  # Opcional: para esquemas
spring.sql.init.data-locations=classpath:data.sql   # Ubicación del script de datos